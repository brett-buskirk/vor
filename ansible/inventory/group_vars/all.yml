---
# =============================================================================
# Ansible Group Variables — All Hosts (vor)
# =============================================================================
# REQUIRED before running the playbook:
#   project_name      — must match terraform.tfvars
#   analytics_domain  — public hostname (Plausible BASE_URL + public TLS host)
#
# SECRETS DO NOT LIVE HERE. Plausible's SECRET_KEY_BASE, TOTP_VAULT_KEY, the
# database passwords, SMTP creds, and the Tailscale auth key are read from a
# gitignored env file / Ansible Vault / -e extra vars — see plausible_env_file
# below and the `-e tailscale_auth_key=...` passed at runtime. Never commit
# real secrets to this file.
# =============================================================================

# -----------------------------------------------------------------------------
# Project (REQUIRED — must match terraform project_name)
# -----------------------------------------------------------------------------
project_name: "your-project-name"

# Public hostname for Plausible (becomes BASE_URL and the public ACME TLS host)
analytics_domain: "analytics.example.com"

# Where the Docker Compose stack is deployed (mirrors TF local.project_dir)
project_dir: "/opt/{{ project_name }}"

# Where analytics data lives — the mount point of the attached DO Block Storage
# volume (mirrors TF local.volume_name). The DB + Caddy-cert bind mounts hang
# off this, so the data survives a droplet rebuild.
data_root: "/mnt/{{ project_name }}-analytics-data"

# Stable device path DO exposes the attached volume at, derived from its name.
# NOTE: DO truncates very long volume names in this serial — if project_name is
# long, confirm the real path (ls -l /dev/disk/by-id/) and override here.
data_volume_device: "/dev/disk/by-id/scsi-0DO_Volume_{{ project_name }}-analytics-data"

deploy_environment: production
timezone: America/New_York

# -----------------------------------------------------------------------------
# Host baseline (brett-buskirk.baseline + secure_user)
# -----------------------------------------------------------------------------
# The non-root sudo user secure_user creates (baseline adds it to the docker
# group). The deploy keeps connecting as root for now; this user is for later
# hardening. Its SSH key is copied from root's authorized_keys on the droplet.
user_name: "deploy"

# -----------------------------------------------------------------------------
# Image versions
# -----------------------------------------------------------------------------
# TODO(vor): pin/verify against https://github.com/plausible/community-edition
# These override the same-named defaults in roles/plausible/defaults/main.yml —
# keep them in lockstep with docker/plausible/docker-compose.yml.
plausible_image: "ghcr.io/plausible/community-edition:v3.2.1"
plausible_postgres_image: "postgres:16-alpine"
plausible_clickhouse_image: "clickhouse/clickhouse-server:24.12-alpine"
plausible_caddy_image: "caddy:2-alpine"

# -----------------------------------------------------------------------------
# Caddy / networking — the public-vs-Tailscale split
# -----------------------------------------------------------------------------
# ACME contact address for the public ingestion certificate.
caddy_acme_email: "admin@example.com"

# The droplet's PUBLIC IP that Caddy's public 80/443 listeners bind to. Defaults
# to the inventory host address (which IS the droplet's public IP), so it tracks
# `terraform output droplet_ip` automatically. Override only for an unusual
# inventory where ansible_host is not the public IP.
public_ip: "{{ ansible_host }}"

# The droplet's TAILSCALE IP that Caddy's dashboard listener binds to. Fallback
# only — the plausible role captures the real address (tailscale ip -4) and
# overrides this via set_fact once the node has joined the tailnet.
tailscale_ip: "100.100.100.100"

# -----------------------------------------------------------------------------
# Tailscale — admin dashboard surface (consumed by brett-buskirk.baseline)
# -----------------------------------------------------------------------------
# The auth key is a SECRET — do NOT store it here. Pass it at runtime:
#   ansible-playbook ... -e "tailscale_auth_key=tskey-auth-xxxx"
# or pull it from Ansible Vault.
tailscale_up_args: "--ssh"

# -----------------------------------------------------------------------------
# Secrets (referenced, never stored)
# -----------------------------------------------------------------------------
# Path (relative to the playbook) to the gitignored env file rendered into the
# stack. Copy docker/plausible/plausible-conf.env.example, fill it in, and keep
# it OUT of git.
# TODO(vor): or switch to Ansible Vault and template plausible-conf.env instead.
# Resolved via playbook_dir so it points unambiguously at the repo's gitignored
# docker/plausible/plausible-conf.env regardless of where ansible runs from.
plausible_env_file: "{{ playbook_dir }}/../../docker/plausible/plausible-conf.env"

# =============================================================================
# Docker Role — Install Docker Engine + Compose plugin
# =============================================================================
# The Plausible stack (Plausible + Postgres + ClickHouse + Caddy) runs under
# Docker Compose, so every vor node needs Docker Engine and the compose plugin.
# =============================================================================
---
- name: Check if Docker is installed
  ansible.builtin.command: docker --version
  register: docker_installed
  ignore_errors: true
  changed_when: false

- name: Install Docker using the convenience script
  when: docker_installed.rc != 0
  block:
    - name: Download Docker installation script
      ansible.builtin.get_url:
        url: https://get.docker.com
        dest: /tmp/get-docker.sh
        mode: "0755"

    - name: Run Docker installation script
      ansible.builtin.command: /tmp/get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Remove installation script
      ansible.builtin.file:
        path: /tmp/get-docker.sh
        state: absent

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ensure the Docker Compose plugin is present
  ansible.builtin.apt:
    name: docker-compose-plugin
    state: present
  failed_when: false

- name: Configure Docker daemon (log rotation)
  ansible.builtin.copy:
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "storage-driver": "overlay2"
      }
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart Docker

# Settle the daemon before the stack is pulled/started (see heimdall's docker
# role for the containerd-image-store rationale).
- name: Flush handlers so the Docker daemon settles before the stack deploys
  ansible.builtin.meta: flush_handlers

# =============================================================================
# Common Role — Base System Configuration
# =============================================================================
# Generic host prep shared by every vor deployment. Mostly complete; the
# TODO(vor) markers call out anything worth revisiting.
# =============================================================================
---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - unzip
      - ca-certificates
      - gnupg
      - lsb-release
      - python3-pip
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone | default('America/New_York') }}"

- name: Enable unattended security updates
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Configure automatic security updates
  ansible.builtin.copy:
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: Create project directory
  ansible.builtin.file:
    path: "{{ project_dir }}"
    state: directory
    mode: "0755"

# ---------------------------------------------------------------------------
# Block Storage volume — the durable home for analytics data
# ---------------------------------------------------------------------------
# The DigitalOcean Block Storage volume (terraform `volume` module) is attached
# to the droplet and appears at a stable /dev/disk/by-id path derived from its
# name. Terraform formats it ext4 at creation, so the filesystem task is a
# no-op in the normal case and a backstop otherwise. We mount it at data_root
# and create the per-service subdirs the compose stack bind-mounts. Analytics
# history is the product, so the filesystem task NEVER reformats a volume that
# already holds a filesystem (force defaults to false) — e.g. one reattached,
# full of data, after a droplet rebuild.
- name: Ensure a filesystem exists on the data volume (no-op if already formatted)
  community.general.filesystem:
    fstype: ext4
    dev: "{{ data_volume_device }}"

- name: Mount the data volume at the data root
  ansible.posix.mount:
    path: "{{ data_root }}"
    src: "{{ data_volume_device }}"
    fstype: ext4
    opts: defaults,nofail,noatime
    state: mounted

- name: Create the per-service data subdirectories on the volume
  ansible.builtin.file:
    path: "{{ data_root }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - postgres
    - clickhouse
    - clickhouse-logs
    - plausible
    - caddy
    - caddy-config

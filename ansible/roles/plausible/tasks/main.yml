# =============================================================================
# Plausible Role — Deploy the analytics stack
# =============================================================================
# Renders the Docker Compose stack (Plausible + Postgres + ClickHouse + Caddy)
# and its config into {{ project_dir }} and brings it up.
#
# The Jinja2 templates under roles/plausible/templates/ (docker-compose.yml.j2,
# Caddyfile.j2, clickhouse/*.j2) are the source of truth; docker/plausible/* is
# the parallel manual path and must stay consistent with them. The env file is
# copied from a gitignored source (filled from plausible-conf.env.example),
# never from a committed secret.
#
# Prerequisites: the `common` role mounted the Block Storage volume at
# {{ data_root }}, and brett-buskirk.baseline installed Docker + joined the
# tailnet just before this role runs.
# =============================================================================
---
# Caddy binds the dashboard listener to the node's Tailscale IP, so capture it
# here (baseline has already run `tailscale up`). Retries briefly because the
# address can take a moment to be assigned. If the node never joined (no auth
# key), this stays empty and the group_vars fallback stands — docker compose
# then fails loudly to bind the dashboard, which is the correct signal.
#
# noqa var-naming[no-role-prefix]: tailscale_ip is a shared var (its group_vars
# fallback and the compose template both use it, like public_ip / data_root),
# not plausible-internal state, so it intentionally has no plausible_ prefix.
- name: Capture the node's Tailscale IPv4 # noqa: var-naming[no-role-prefix]
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip_result
  changed_when: false
  failed_when: false
  retries: 6
  delay: 5
  until: tailscale_ip_result.rc == 0 and (tailscale_ip_result.stdout | trim | length > 0)

- name: Set tailscale_ip fact for Caddy's dashboard listener # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout_lines[0] | trim }}"
  when: tailscale_ip_result.rc == 0 and (tailscale_ip_result.stdout | trim | length > 0)

- name: Create the stack directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ project_dir }}"
    - "{{ project_dir }}/clickhouse"

- name: Template the Docker Compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ project_dir }}/docker-compose.yml"
    mode: "0644"
  notify: Restart plausible stack

- name: Template the Caddyfile (public ingestion + Tailscale dashboard split)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ project_dir }}/Caddyfile"
    mode: "0644"
  notify: Restart plausible stack

- name: Template the ClickHouse config tweaks
  ansible.builtin.template:
    src: "clickhouse/{{ item }}.j2"
    dest: "{{ project_dir }}/clickhouse/{{ item }}"
    mode: "0644"
  loop:
    - logs.xml
    - ipv4-only.xml
    - low-resources.xml
    - default-profile-low-resources-overrides.xml
  notify: Restart plausible stack

- name: Install the Plausible env file (secrets — from a gitignored source / Vault)
  ansible.builtin.copy:
    src: "{{ plausible_env_file }}"
    dest: "{{ project_dir }}/plausible-conf.env"
    mode: "0600"
  notify: Restart plausible stack
  # TODO(vor): prefer templating this from Ansible Vault rather than copying a
  # plaintext env file. Never commit the real file — only *.example.

- name: Pull the stack images
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ project_dir }}"
  changed_when: false

- name: Bring the stack up
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ project_dir }}"
  register: plausible_compose_up
  changed_when: "'Started' in plausible_compose_up.stdout or 'Created' in plausible_compose_up.stdout"

# Readiness gate: probe Plausible's own port for the tracking script (an
# always-200, unauthenticated path) from inside the network via the caddy
# container's busybox wget. This blocks until migrations finish and the app is
# actually serving — so a failed migration surfaces here, not as a silent
# half-up stack. No extra collections needed.
- name: Wait for Plausible to be serving (readiness gate)
  ansible.builtin.command:
    cmd: docker compose exec -T caddy wget -q -T 5 -O /dev/null http://plausible:8000/js/script.js
  args:
    chdir: "{{ project_dir }}"
  register: plausible_ready
  until: plausible_ready.rc == 0
  retries: 30
  delay: 10
  changed_when: false

# =============================================================================
# vor — Plausible Analytics Stack (Docker Compose)
# =============================================================================
# Self-hosted Plausible Community Edition. Deploy via the Ansible `plausible`
# role for production; this file is the parallel manual/run-by-hand path and
# must stay consistent with roles/plausible/templates/.
#
# Services:
#   plausible            — the app (listens :8000 inside the network only)
#   plausible_db         — PostgreSQL: accounts, site config, metadata
#   plausible_events_db  — ClickHouse: the analytics events (the big table)
#   caddy                — reverse proxy + TLS; the ONLY service that publishes
#                          host ports
#
# ── THE DEFINING SPLIT ──────────────────────────────────────────────────────
# vor MUST expose a PUBLIC event-ingestion endpoint — visitors on tracked sites
# POST to it. So Caddy serves PUBLICLY (80/443, from anywhere) ONLY the tracking
# script path /js/* and the event API /api/event (plus ACME/health). The admin
# DASHBOARD (/, /login, /settings, everything else) is bound to the TAILSCALE
# interface only. Postgres (5432) and ClickHouse (8123/9000) are never
# published — they stay on the internal Docker network. See ./Caddyfile.example.
#
# Image versions are pinned and verified against the upstream Community Edition
# compose (github.com/plausible/community-edition) as of 2026-07. Bumps flow
# through Dependabot once the stack is live — no `latest`.
#
# Usage (manual path):
#   cp plausible-conf.env.example plausible-conf.env    # then fill in secrets
#   export DATA_ROOT=/mnt/<project_name>-analytics-data # the block-volume mount
#   export PUBLIC_IP=<droplet public ip> TAILSCALE_IP=<droplet tailscale ip>
#   docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — accounts, site configuration, metadata
  # ---------------------------------------------------------------------------
  plausible_db:
    image: postgres:16-alpine
    container_name: vor_plausible_db
    restart: always
    volumes:
      # On the attached Block Storage volume (DATA_ROOT) so accounts + site
      # config survive a droplet rebuild. See "Data durability" at the bottom.
      - ${DATA_ROOT:-/mnt/vor-analytics-data}/postgres:/var/lib/postgresql/data
    # POSTGRES_PASSWORD is read from the shared secret env file — the SAME file
    # the app uses — so a plain `docker compose up` works without any shell env
    # and the password can never drift from the one inside the app's
    # DATABASE_URL. (Postgres ignores the app-only vars in that file.)
    env_file:
      - plausible-conf.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m
    # No ports: — Postgres is reachable only on the internal network.
    networks:
      - vor

  # ---------------------------------------------------------------------------
  # ClickHouse — the analytics events store
  # ---------------------------------------------------------------------------
  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: vor_plausible_events_db
    restart: always
    volumes:
      # The events table (the product) on the Block Storage volume (DATA_ROOT).
      - ${DATA_ROOT:-/mnt/vor-analytics-data}/clickhouse:/var/lib/clickhouse
      - ${DATA_ROOT:-/mnt/vor-analytics-data}/clickhouse-logs:/var/log/clickhouse-server
      # Plausible's recommended ClickHouse tweaks. logs.xml + ipv4-only.xml apply
      # everywhere; low-resources.xml + the users.d override tune ClickHouse for
      # the small default node (s-2vcpu-4gb). All four are verbatim upstream.
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m
    # No ports: — ClickHouse (8123/9000) is reachable only on the internal network.
    networks:
      - vor

  # ---------------------------------------------------------------------------
  # Plausible — the application (listens :8000 internally, never published)
  # ---------------------------------------------------------------------------
  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.1
    container_name: vor_plausible
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    # Secrets + connection strings live in a gitignored env file (never commit
    # the real one — only plausible-conf.env.example). CI creates it from the
    # example to validate this compose file.
    env_file:
      - plausible-conf.env
    volumes:
      - ${DATA_ROOT:-/mnt/vor-analytics-data}/plausible:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # No ports: — Caddy is the only public entrypoint. Plausible is reached at
    # the internal DNS name `plausible:8000`.
    networks:
      - vor

  # ---------------------------------------------------------------------------
  # Caddy — reverse proxy + TLS, the only service that publishes host ports
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: vor_caddy
    restart: always
    depends_on:
      - plausible
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ACME certs/keys + Caddy state on the durable volume, so a droplet rebuild
      # reuses the existing cert instead of re-running ACME (Let's Encrypt has
      # tight issuance rate limits).
      - ${DATA_ROOT:-/mnt/vor-analytics-data}/caddy:/data
      - ${DATA_ROOT:-/mnt/vor-analytics-data}/caddy-config:/config
    environment:
      # Consumed by the Caddyfile (see Caddyfile.example).
      - ANALYTICS_DOMAIN=${ANALYTICS_DOMAIN:-analytics.example.com}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    ports:
      # PUBLIC ingestion + ACME TLS — bound to the droplet's PUBLIC IP so the
      # world can reach /js/* and /api/event. TODO(vor): set PUBLIC_IP.
      - "${PUBLIC_IP:-203.0.113.10}:80:80"
      - "${PUBLIC_IP:-203.0.113.10}:443:443"
      # ADMIN dashboard — bound to the TAILSCALE IP only, never the public IP.
      # Caddy serves the dashboard on :8443 internally; publishing it solely on
      # the tailnet address keeps it off the public internet.
      # TODO(vor): set TAILSCALE_IP (tailscale ip -4 on the droplet).
      - "${TAILSCALE_IP:-100.100.100.100}:443:8443"
    networks:
      - vor

# =============================================================================
# Networks
# =============================================================================
networks:
  vor:
    driver: bridge

# =============================================================================
# Data durability
# =============================================================================
# vor deliberately does NOT use Docker named volumes for state. Every stateful
# path is bind-mounted under DATA_ROOT, which points at the attached DigitalOcean
# Block Storage volume — Ansible mounts it at /mnt/<project_name>-analytics-data;
# the manual default here (/mnt/vor-analytics-data) matches the repo example.
#
# Because the databases, Plausible's state, and Caddy's ACME certs all live on
# that volume, the droplet can be rebuilt and the volume reattached with ZERO
# data loss — analytics history is the product. Named volumes on the droplet's
# own disk would not survive a rebuild, which is exactly what we want to avoid.
#
#   export DATA_ROOT=/mnt/<project_name>-analytics-data   # before docker compose up
#
# The subdirectories (postgres/, clickhouse/, clickhouse-logs/, plausible/,
# caddy/, caddy-config/) are created by the Ansible common role (or scripts/
# deploy.sh); Docker also auto-creates any missing bind-mount source dir on `up`.
